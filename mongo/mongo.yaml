
apiVersion: v1
kind: Namespace
metadata:
  name: theship-mongo
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: theship-mongo
data:
  init-theship.js: |
    db.getSiblingDB("theshipdb").createUser({
        user: "theship",
        pwd: "theship1234",
        roles: [{ role: "readWrite", db: "theshipdb" }]
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: theship-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:4.4
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: admin1234
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - "mongo"
                - "--quiet"
                - "mongodb://theship:theship1234@127.0.0.1:27017/theshipdb"
                - "--eval"
                - "db.runCommand({ ping: 1 }).ok"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: mongo-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: theship-mongo
spec:
  type: LoadBalancer
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 2021
      targetPort: 27017
